<!doctype html>
<!-- 人类审计视图骨架（admin 模板资产；设计 §13.2）
     由 vima render-review 从 docs/spec.md 结构化数据块确定性渲染，请勿手工修改。
     铁律：单文件零外部请求（href 仅 # 锚点）；禁 JS 完整可读（本骨架不含任何 JS）；
     明暗主题跟随 prefers-color-scheme。占位符为双花括号包裹的 TITLE 与 CONTENT
     （此注释刻意不写占位符原文，避免被渲染器的整串替换命中）。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
/* ── 明暗两套 CSS 变量：默认亮色，跟随系统偏好切暗色 ── */
:root{
  --bg:#f7f6f3; --panel:#ffffff; --panel-soft:#f1efe9;
  --fg:#22201b; --fg-dim:#5f5a4f; --fg-faint:#948d7e;
  --line:#e2ded3; --line-soft:#eceade;
  --accent:#8a541d; --accent-soft:#f5ecdf; --accent-line:#e0c7a4;
  --ok:#1f6b52; --warn:#9a341f; --warn-soft:#f9e8e3; --warn-line:#e5bdb2;
  --code-bg:#f2f0ea;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#161411; --panel:#201d18; --panel-soft:#272319;
    --fg:#ebe6da; --fg-dim:#b1a795; --fg-faint:#847b6b;
    --line:#39332a; --line-soft:#2b2620;
    --accent:#d9a668; --accent-soft:#33291a; --accent-line:#59482e;
    --ok:#6ebb9f; --warn:#e08a71; --warn-soft:#331e18; --warn-line:#5c3529;
    --code-bg:#282318;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
[id]{scroll-margin-top:1rem}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
  font-size:15px;line-height:1.8;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
.wrap{max-width:60rem;margin:0 auto;padding:1.5rem 1.2rem 4rem}

/* 封面 */
.hero{padding:1.6rem 0 1.2rem;border-bottom:1px solid var(--line)}
.hero .kicker{font-family:var(--mono);font-size:.72rem;letter-spacing:.28em;color:var(--accent);margin:0 0 .6rem}
.hero h1{font-size:1.9rem;margin:0 0 .5rem;letter-spacing:-.02em}
.hero .sub{color:var(--fg-dim);margin:0;max-width:44rem}
.stats{display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.5rem .9rem;min-width:6.5rem}
.stat .n{font-size:1.15rem;font-weight:700}
.stat .l{font-size:.68rem;color:var(--fg-faint);font-family:var(--mono)}

/* 顶部目录（粘性：§13.2 渐进增强，滚动时保持四视图入口可达） */
.toc{display:flex;flex-wrap:wrap;gap:.4rem;align-items:baseline;padding:.9rem 0;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--bg);z-index:5}
.toc a{background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:.15rem .7rem;font-size:.8rem;color:var(--fg-dim)}
.toc a:hover{border-color:var(--accent-line);color:var(--accent);text-decoration:none}
.toc .toc-sep{font-family:var(--mono);font-size:.7rem;color:var(--fg-faint);margin-left:.5rem}

/* 视图区 */
.view{padding:2rem 0 .4rem}
.view>h2{font-size:1.3rem;margin:0 0 .3rem;letter-spacing:-.01em}
.view>h2 .num{font-family:var(--mono);color:var(--accent);margin-right:.5em;font-size:.9em}
.view>.vd{color:var(--fg-dim);font-size:.86rem;margin:0 0 1rem}

/* 表格 */
.tw{overflow-x:auto;margin:.8rem 0;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.84rem;line-height:1.65}
th,td{padding:.45rem .75rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line-soft)}
thead th{background:var(--panel-soft);font-weight:650;font-size:.75rem;color:var(--fg-dim);white-space:nowrap;
  border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
td.c{text-align:center}

/* 卡片 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.9rem 1.1rem;margin:.8rem 0}
.card h3{font-size:1.02rem;margin:0 0 .5rem}
.card .meta{font-size:.82rem;color:var(--fg-dim);margin:.3rem 0}

/* 通用小件 */
.tid{font-family:var(--mono);font-size:.68rem;color:var(--fg-faint);border:1px solid var(--line);
  border-radius:5px;padding:0 .35em;margin-left:.45em;white-space:nowrap}
.xref{color:var(--accent)}
.dim{color:var(--fg-faint)}
.warn{color:var(--warn);font-size:.8rem}
code,.api{font-family:var(--mono);font-size:.8em;background:var(--code-bg);padding:.1em .4em;
  border-radius:5px;border:1px solid var(--line-soft);white-space:nowrap}
.api{color:var(--accent)}
.api-missing{color:var(--warn);border-color:var(--warn-line);background:var(--warn-soft)}

/* ① 权限盲区整行高亮 */
tr.blind td{background:var(--warn-soft)}
.blind-tag{display:inline-block;margin-left:.6em;color:var(--warn);font-size:.76rem;
  border:1px solid var(--warn-line);border-radius:6px;padding:0 .4em;white-space:nowrap}

/* ③ 业务流程泳道 */
.lane{list-style:none;margin:.4rem 0 0;padding:0;counter-reset:step}
.lane li{position:relative;padding:.5rem .4rem .5rem 2.4rem;border-bottom:1px dashed var(--line-soft);
  counter-increment:step}
.lane li:last-child{border-bottom:0}
.lane li::before{content:counter(step);position:absolute;left:.3rem;top:.6rem;
  font-family:var(--mono);font-size:.7rem;color:var(--accent);border:1px solid var(--accent-line);
  border-radius:999px;width:1.35rem;height:1.35rem;display:flex;align-items:center;justify-content:center;
  background:var(--accent-soft)}
.lane .lane-role{font-weight:640}
.lane .lane-arrow{font-family:var(--mono);color:var(--fg-faint);margin:0 .3em}
.lane .lane-action{color:var(--fg-dim);margin:0 .3em}

/* ④ 页面卡 */
.page-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:1rem 1.2rem;margin:1rem 0}
.page-card h3{font-size:1.1rem;margin:0 0 .35rem}
.page-card h4{font-size:.86rem;margin:1.1rem 0 .35rem;color:var(--fg-dim);font-weight:650}
/* A14 版面草图：结构可视化（纵向堆叠 / 分栏两态） */
.sk{margin:.4rem 0 .6rem;border:1px solid var(--line);background:var(--bg);padding:.45rem}
.sk-stack{display:flex;flex-direction:column;gap:.3rem}
.sk-cols{display:flex;gap:.45rem;align-items:stretch}
.sk-band{display:flex;flex-direction:column;gap:.3rem}
.sk-col{min-width:0;display:flex;flex-direction:column;gap:.3rem;
  border:1px dashed var(--line);padding:.35rem;background:var(--panel)}
.sk-col-cap{display:flex;justify-content:space-between;gap:.4rem;align-items:baseline;
  font-size:.7rem;color:var(--fg-dim);font-family:var(--mono);
  padding-bottom:.25rem;border-bottom:1px solid var(--line-soft)}
.sk-b{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;
  border:1px solid var(--line-soft);background:var(--panel);padding:.3rem .45rem}
.sk-cols .sk-b{background:var(--bg)}
.sk-cn{font-size:.8rem;color:var(--fg)}
.sk-w{font-family:var(--mono);font-size:.68rem;color:var(--fg-faint)}
.sk-table{min-height:2.6rem;align-items:center}
.sk-cards,.sk-tabs{border-style:dashed}
.chip-lead{font-size:.72rem;color:var(--fg-faint);margin-right:.15rem}
@media (max-width:820px){.sk-cols{flex-direction:column}.sk-col{flex:1 1 auto!important}}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem;margin:.3rem 0}
.chip{font-family:var(--mono);font-size:.74rem;background:var(--accent-soft);color:var(--accent);
  border:1px solid var(--accent-line);border-radius:6px;padding:.1rem .5rem}
.chip-arrow{font-family:var(--mono);color:var(--fg-faint)}
.page-card ul{margin:.3rem 0;padding-left:1.4rem}
.page-card li{margin:.22rem 0;font-size:.86rem}
.modal-card{border:1px dashed var(--accent-line);border-radius:10px;background:var(--panel-soft);
  padding:.7rem .9rem;margin:.6rem 0}
.modal-card h4{margin:0 0 .4rem;font-size:.9rem;color:var(--fg)}

/* 审核指引（读者=拍板人，§13.2） */
.guide{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:12px;
  padding:.9rem 1.2rem;margin:1rem 0 0}
.guide h2{font-size:1rem;margin:0 0 .5rem;color:var(--accent)}
.guide ol{margin:.3rem 0;padding-left:1.4rem}
.guide li{margin:.3rem 0;font-size:.86rem}
.guide .guide-act{font-size:.84rem;margin:.6rem 0 0;color:var(--fg-dim)}

/* pendingConfirm 待确认（§13.1 信息源分级的人眼投影） */
.pend{display:inline-block;margin-left:.5em;color:var(--warn);font-size:.74rem;
  border:1px solid var(--warn-line);background:var(--warn-soft);border-radius:6px;
  padding:0 .4em;white-space:nowrap;font-weight:400}
.stat-warn{border-color:var(--warn-line);background:var(--warn-soft)}
.stat-warn .n{color:var(--warn)}
.toc-warn{border-color:var(--warn-line)!important;color:var(--warn)!important;background:var(--warn-soft)!important}
.pending ul{margin:.3rem 0;padding-left:1.4rem}
.pending li{margin:.3rem 0;font-size:.88rem}

/* 本期不做 · 范围红线（A13） */
.redline ul{list-style:none;margin:.4rem 0 0;padding:0}
.redline li{margin:.4rem 0;font-size:.88rem;padding:.5rem .7rem;
  border:1px solid var(--warn-line);background:var(--warn-soft);border-radius:8px}
.redline .ng-id{font-family:var(--mono);color:var(--warn);margin-right:.6em;font-size:.86em}
.redline .ng-empty{color:var(--fg-dim);font-size:.86rem;margin:.4rem 0 0}

/* ⑤ 业务规则（A13） */
.rule-type{display:inline-block;font-family:var(--mono);font-size:.72rem;
  border:1px solid var(--line);border-radius:6px;padding:0 .4em;margin-right:.5em;
  color:var(--fg-dim);white-space:nowrap}

.foot{margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--line);
  font-size:.74rem;color:var(--fg-faint);line-height:1.8}
/* ── A16 多端：端徽标 + 页面详情端分组标题（单端项目不渲染这两类节点）── */
.app-tag{display:inline-block;margin-left:.5em;padding:.05em .5em;border:1px solid var(--line);
  border-radius:99px;font-size:.72rem;font-family:var(--mono);color:var(--fg-dim);
  background:var(--bg-soft);vertical-align:middle}
.app-group{margin:1.6em 0 .6em;padding:.3em .8em;border-left:3px solid var(--line);
  font-size:.95rem;color:var(--fg-dim);background:var(--bg-soft);border-radius:4px}
@media print{
  body{background:#fff}
  .toc{display:none}
  .view,.card,.page-card{break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap">
{{CONTENT}}
</div>
</body>
</html>
