<!doctype html>
<!-- 线框原型骨架（admin 模板资产；设计 §13.3）
     由 vima render-prototype 从 docs/spec.md 结构化数据块确定性渲染，请勿手工修改。
     刻意无样式感：语义占位线框（灰盒虚线），只表达功能与布局，不表达视觉美学。
     单文件零外部请求（href 仅 # 锚点）；JS 仅渐进增强（弹窗显隐）；
     禁 JS 时由 <noscript> 样式把全部弹窗平铺展开，内容仍完整可读。
     占位符为双花括号包裹的 TITLE 与 CONTENT
     （此注释刻意不写占位符原文，避免被渲染器的整串替换命中）。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
/* ── 明暗两套 CSS 变量：默认亮色，跟随系统偏好切暗色 ── */
:root{
  --bg:#f4f4f2; --panel:#fdfdfc; --ph:#e4e2dc; --ph-deep:#d4d1c8;
  --fg:#2a2823; --fg-dim:#6b665a; --fg-faint:#9a9384;
  --line:#b9b4a7; --line-soft:#d9d5ca;
  --warn:#9a341f; --warn-soft:#f9e8e3; --warn-line:#d9a08f;
  --overlay:rgba(42,40,35,.45);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#191813; --panel:#211f19; --ph:#312e26; --ph-deep:#3c382e;
    --fg:#e8e3d7; --fg-dim:#aaa08d; --fg-faint:#7c7364;
    --line:#57513f; --line-soft:#3a352a;
    --warn:#e08a71; --warn-soft:#331e18; --warn-line:#6d4234;
    --overlay:rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
[id]{scroll-margin-top:1rem}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
  font-size:14px;line-height:1.7}
a{color:inherit}
.wrap{max-width:72rem;margin:0 auto;padding:1.2rem 1rem 4rem;
  display:flex;gap:1.2rem;align-items:flex-start}

/* 管理后台外壳：侧边菜单树 + 角色视角（真实系统导航结构的线框投影） */
.wf-side{position:sticky;top:.8rem;width:15.5rem;flex-shrink:0;
  max-height:calc(100vh - 1.6rem);overflow:auto;
  border:1px solid var(--line);background:var(--panel);padding:.8rem}
.wf-side-title{font-family:var(--mono);font-weight:700;font-size:.95rem;
  padding-bottom:.5rem;border-bottom:1px solid var(--line-soft)}
.wf-side-sub{display:block;font-weight:400;font-size:.68rem;color:var(--fg-faint);letter-spacing:.12em}
.wf-roles{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;
  padding:.6rem 0;border-bottom:1px solid var(--line-soft)}
.wf-roles-label{font-size:.7rem;color:var(--fg-faint);width:100%}
.wf-chip{font-family:var(--mono);font-size:.72rem;border:1px solid var(--line);
  background:var(--bg);color:var(--fg-dim);padding:.1rem .5rem;cursor:pointer}
.wf-chip:hover{border-color:var(--fg-dim);color:var(--fg)}
.wf-chip-on{border-color:var(--fg);color:var(--fg);background:var(--ph)}
.wf-menu-tree{display:flex;flex-direction:column;gap:.15rem;padding-top:.6rem}
.wf-menu{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;
  padding:.35rem .45rem;text-decoration:none;border:1px solid transparent;font-size:.8rem}
.wf-menu:hover{border-color:var(--line);background:var(--bg)}
.wf-menu-name{font-weight:600}
.wf-menu-roles{margin-left:auto;display:inline-flex;gap:.2rem}
.wf-menu-roles i{font-style:normal;font-family:var(--mono);font-size:.62rem;
  border:1px solid var(--line-soft);background:var(--ph);color:var(--fg-dim);
  padding:0 .3em;white-space:nowrap}
.wf-menu-roles .wf-menu-blind{color:var(--warn);border-color:var(--warn-line);background:var(--warn-soft)}
.wf-menu-group{font-size:.66rem;color:var(--fg-faint);letter-spacing:.15em;
  margin:.6rem 0 .1rem;padding-top:.5rem;border-top:1px dashed var(--line-soft)}
.wf-dim{opacity:.22;filter:grayscale(1)}
.wf-main{flex:1;min-width:0}

/* 待确认徽标（§13.1 pendingConfirm 的人眼投影） */
.wf-pend{display:inline-block;margin-left:.4em;font-size:.66rem;color:var(--warn);
  border:1px solid var(--warn-line);background:var(--warn-soft);padding:0 .35em;
  white-space:nowrap;font-weight:400;font-family:var(--sans)}

/* 头部说明 */
.wf-head{padding:.6rem 0 1rem;border-bottom:1px solid var(--line-soft)}
.wf-head h1{font-size:1.25rem;margin:0 0 .2rem;font-family:var(--mono);letter-spacing:.02em}
.wf-head p{margin:.2rem 0 0;font-size:.8rem;color:var(--fg-dim)}

/* 页面线框 */
.wf-page{margin:1.6rem 0;border:1px solid var(--line);background:var(--panel);padding:1rem}
.wf-page-head{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;
  border-bottom:1px solid var(--line-soft);padding-bottom:.5rem;margin-bottom:.8rem}
.wf-page-head h2{font-size:1.05rem;margin:0}
.tid{font-family:var(--mono);font-size:.68rem;color:var(--fg-faint);border:1px solid var(--line-soft);
  padding:0 .35em;white-space:nowrap}

/* 布局区块：灰盒虚线 */
/* A14 分栏：一行 N 列，每列一叠区块；窄屏落回纵向堆叠 */
.wf-cols{display:flex;gap:.6rem;align-items:flex-start;margin:.7rem 0}
.wf-col{min-width:0;border:1px solid var(--line-soft);background:var(--panel);padding:.2rem .5rem .5rem}
.wf-col>.wf-block{margin:.9rem 0 .5rem}
.wf-col-cap{display:flex;justify-content:space-between;gap:.5rem;align-items:baseline;
  font-family:var(--mono);font-size:.68rem;color:var(--fg-dim);
  padding:.3rem 0 .1rem;border-bottom:1px solid var(--line-soft)}
.wf-col-w{color:var(--fg-faint)}
@media (max-width:900px){.wf-cols{flex-direction:column}.wf-col{flex:1 1 auto!important}}
.wf-block{position:relative;border:1.5px dashed var(--line);background:var(--bg);
  padding:1.2rem .8rem .8rem;margin:.7rem 0}
.wf-tag{position:absolute;left:.5rem;top:-.05rem;transform:translateY(-50%);
  font-family:var(--mono);font-size:.66rem;color:var(--fg-faint);background:var(--panel);
  border:1px solid var(--line-soft);padding:0 .4em;letter-spacing:.08em}
.wf-row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:flex-end}

/* 组件占位符 */
.wf-field{display:inline-flex;flex-direction:column;gap:.15rem;font-size:.78rem;min-width:9rem}
.wf-label{color:var(--fg-dim)}
.wf-req{color:var(--warn);margin-left:.2em}
.wf-input{display:block;min-height:1.7rem;border:1.5px dashed var(--line);background:var(--panel);
  padding:.15rem .5rem;color:var(--fg-faint);font-size:.76rem}
.wf-btn{display:inline-flex;align-items:center;gap:.35em;font-family:var(--mono);font-size:.78rem;
  border:1.5px solid var(--fg-dim);background:var(--panel);color:var(--fg);
  padding:.25rem .7rem;cursor:pointer;text-decoration:none}
.wf-btn:hover{background:var(--ph)}
.wf-api{font-family:var(--mono);font-size:.68rem;border:1px solid var(--line);
  background:var(--ph);color:var(--fg-dim);padding:0 .4em;white-space:nowrap}
.wf-ph{display:block;height:.85rem;background:var(--ph);min-width:3.5rem}
.wf-ph-lg{height:3.2rem;background:var(--ph)}
.wf-desc{display:block;font-style:normal;font-weight:400;font-size:.68rem;color:var(--fg-faint)}

/* 表格：真实列头 + 灰占位行 */
.wf-tw{overflow-x:auto;margin-top:.4rem;max-width:100%}
.wf-table table{border-collapse:collapse;width:100%;font-size:.8rem}
.wf-table th,.wf-table td{border:1px solid var(--line-soft);padding:.35rem .6rem;text-align:left}
.wf-table thead th{background:var(--ph);font-weight:650}
.wf-table .wf-missing{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)}
.wf-table .wf-ops{white-space:nowrap}
.wf-table .wf-ops .wf-btn{padding:.1rem .5rem;font-size:.72rem;margin-right:.3rem}

/* 分页占位 */
.wf-pg{display:inline-block;font-family:var(--mono);font-size:.76rem;border:1px solid var(--line);
  background:var(--panel);color:var(--fg-dim);padding:.05rem .5rem;margin-right:.25rem}

/* 弹窗卡：默认 hidden（UA 样式 display:none），按钮触发显示 */
.wf-modal{border:2px solid var(--fg-dim);background:var(--panel);margin:.8rem 0;
  box-shadow:.4rem .4rem 0 var(--ph-deep);max-width:26rem}
.wf-modal[hidden]{display:none}
/* JS 显隐态＝遮罩层（§13.3 弹窗=遮罩层）：巨型 box-shadow 充当背板，零额外元素；
   noscript 平铺态 hidden 属性仍在，:not([hidden]) 不命中，不受影响 */
.wf-modal:not([hidden]){position:fixed;inset:0;margin:auto;height:fit-content;
  max-height:85vh;overflow:auto;width:min(26rem,92vw);z-index:10;
  box-shadow:0 0 0 100vmax var(--overlay),.4rem .4rem 0 var(--ph-deep)}
.wf-modal-head{display:flex;align-items:center;gap:.5rem;border-bottom:1px solid var(--line-soft);
  padding:.5rem .8rem}
.wf-modal-head strong{font-size:.9rem}
.wf-modal-head .wf-close{margin-left:auto;border:1px solid var(--line);background:var(--panel);
  font-family:var(--mono);cursor:pointer;padding:0 .45rem;color:var(--fg-dim)}
.wf-modal-body{display:flex;flex-direction:column;gap:.6rem;padding:.8rem}
.wf-modal-body .wf-field{min-width:0}
.wf-modal-foot{display:flex;align-items:center;gap:.5rem;border-top:1px solid var(--line-soft);
  padding:.5rem .8rem}

/* 流程演示区（§13.3 流程演示模式）：步骤点击回放到页面锚点 */
.wf-flows{margin:1.6rem 0;border:1px solid var(--line);background:var(--panel);padding:1rem}
.wf-flows-hint{margin:.2rem 0 .6rem;font-size:.78rem;color:var(--fg-dim)}
.wf-flow{border:1.5px dashed var(--line);background:var(--bg);padding:.7rem .8rem;margin:.7rem 0}
.wf-flow-head{display:flex;align-items:baseline;gap:.5rem;margin-bottom:.4rem}
.wf-flow-steps{margin:0;padding-left:1.4rem;display:flex;flex-direction:column;gap:.4rem}
.wf-flow-steps li{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-size:.8rem}
.wf-flow-role{font-family:var(--mono);font-size:.7rem;border:1px solid var(--line);
  background:var(--ph);color:var(--fg-dim);padding:0 .4em;white-space:nowrap}
.wf-flow-page{font-family:var(--mono);font-size:.76rem;border:1px solid var(--fg-dim);
  background:var(--panel);color:var(--fg);padding:.1rem .5rem;text-decoration:none}
.wf-flow-page:hover{background:var(--ph)}
.wf-flow-action{color:var(--fg-dim)}
.wf-flow-next{color:var(--fg-faint);display:inline-flex;align-items:center;gap:.3em}

.wf-foot{margin-top:2rem;padding-top:.8rem;border-top:1px solid var(--line-soft);
  font-size:.72rem;color:var(--fg-faint);line-height:1.8}
@media (max-width: 52rem){
  .wrap{flex-direction:column}
  .wf-side{position:static;width:100%;max-height:none}
}
@media print{
  .wf-side{display:none}
  .wf-page{break-inside:avoid}
  .wf-modal[hidden]{display:block}
  .wf-tw{overflow:visible}
}
</style>
<noscript><style>
/* 禁 JS 降级：全部弹窗平铺可见（§13.3），交互按钮保留为静态标注；
   角色视角 chips 依赖 JS，隐藏之（角色归属仍由菜单行徽标静态可读） */
.wf-modal[hidden]{display:block}
.wf-roles{display:none}
</style></noscript>
</head>
<body>
<div class="wrap">
{{CONTENT}}
</div>
<script>
// 渐进增强其一：事件委托驱动弹窗显隐。
// data-modal="MODAL-xx" 的按钮打开对应弹窗；data-modal-close 关闭所在弹窗。
document.addEventListener('click', function (e) {
  if (!e.target.closest) return;
  var opener = e.target.closest('[data-modal]');
  if (opener) {
    var m = document.getElementById(opener.getAttribute('data-modal'));
    if (m) m.hidden = false;
    return;
  }
  var closer = e.target.closest('[data-modal-close]');
  if (closer) {
    var card = closer.closest('.wf-modal');
    if (card) card.hidden = true;
  }
});
// 渐进增强其二：角色视角——点选角色 chip 后，淡出该角色不可见的菜单与页面
// （data-roles 为空格分隔的角色 ID 列表；未带 data-roles 的元素不参与过滤）。
(function () {
  var bar = document.querySelector('[data-role-chips]');
  if (!bar) return;
  bar.addEventListener('click', function (e) {
    var chip = e.target.closest('[data-role-chip]');
    if (!chip) return;
    var role = chip.getAttribute('data-role-chip');
    var chips = bar.querySelectorAll('[data-role-chip]');
    for (var i = 0; i < chips.length; i++) {
      chips[i].classList.toggle('wf-chip-on', chips[i] === chip);
    }
    var items = document.querySelectorAll('[data-roles]');
    for (var j = 0; j < items.length; j++) {
      var owns = !role || (' ' + items[j].getAttribute('data-roles') + ' ').indexOf(' ' + role + ' ') >= 0;
      items[j].classList.toggle('wf-dim', !owns);
    }
  });
})();
</script>
</body>
</html>
