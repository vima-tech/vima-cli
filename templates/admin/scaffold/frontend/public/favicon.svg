<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 站点图标：与顶栏品牌标识同一套企业蓝渐变（tokens.css 的 --v-brand-grad） -->
  <defs>
    <linearGradient id="v-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#235c9b" />
      <stop offset="0.62" stop-color="#347fc7" />
      <stop offset="1" stop-color="#48b7cf" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#v-brand)" />
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" opacity="0.95">
    <rect x="8" y="8" width="6.5" height="6.5" rx="1.4" />
    <rect x="17.5" y="8" width="6.5" height="6.5" rx="1.4" />
    <rect x="8" y="17.5" width="6.5" height="6.5" rx="1.4" />
    <rect x="17.5" y="17.5" width="6.5" height="6.5" rx="1.4" />
  </g>
</svg>
