server:
  port: 8080

spring:
  application:
    name: {{projectName}}
  datasource:
    # PostgreSQL：本脚手架唯一启用的数据库，启动前需先建库（见 backend/docker-compose.yml）。
    # 切换 MySQL / 人大金仓等其他库的写法见 application-database.yml。
    url: jdbc:postgresql://localhost:5432/{{projectPkg}}
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # update：启动时按实体自动建表/补列；生产建议改 validate，表结构交由迁移脚本管理
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # Redis：登录态（token）与权限缓存都存在这里，属必需组件，未启动则应用无法登录
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# 日志。文件名取 spring.application.name，落盘规则见 logback-spring.xml；
# 压缩与过期清理由两个内置定时任务执行（后台「任务管理」可改 cron / 停用）：
#   日志归档     logArchive   —— 压缩、删除日志文件
#   数据库日志清理 dbLogCleanup —— 删除过期的操作日志与登录日志
log:
  # 日志目录，相对路径以应用启动目录为基准
  dir: ./logs
  # 单个日志文件大小上限：当天写满就顺延切下一段（xxx-2026-08-12.0.log、.1.log …）
  max-file-size: 50MB
  # 滚动日志超过这个天数即 gzip 压缩为 .log.gz；在此之前保持纯文本，便于 tail/grep。
  # 必须小于 retain-days，否则文件先被删光，压缩永远轮不到（任务会告警并降级为只清理）
  compress-after-days: 7
  # 保留天数，同时管三样：日志文件（.log 与 .log.gz）、数据库里的操作日志与登录日志
  retain-days: 30

app:
  # 权限缓存存活秒数：username → perms/menuPaths/menuIcons 在 Redis 的 TTL。
  # 用户/角色/菜单变更时由 PermissionService.evict* 主动失效，TTL 只是兜底。
  perm-cache-ttl: 1800

auth:
  # 登录态存活毫秒数（默认 24h）。每次带 token 的请求都会滑动续期，见 TokenAuthFilter。
  token-ttl: 86400000

file:
  upload-dir: ./uploads
  base-url: http://localhost:8080
