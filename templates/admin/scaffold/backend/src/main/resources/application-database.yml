# 数据库配置说明
# 本脚手架默认且实际启用的是 PostgreSQL（已写在 application.yml 里，不是可选项）。
# 需要换库时，把下面对应段落抄进 application.yml 覆盖 spring.datasource / spring.jpa。
#
# 注意：Redis 不在此列——它是登录态与权限缓存的载体，属必需组件，没有"换成别的"这一档。

# ============================================================
# PostgreSQL (默认，application.yml 中生效的就是这一份)
# ============================================================
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/{{projectPkg}}
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

