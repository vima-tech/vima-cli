# ============================================================
# 注意事项
# ============================================================
# 1. 人大金仓、达梦、神通等国产数据库均兼容 PostgreSQL 方言
# 2. 首次启动时 ddl-auto: update 会自动创建表结构，DataInitializer 只在库为空时灌种子数据
# 3. 生产环境建议改为 ddl-auto: validate 或 none
# 4. 国产数据库需要额外下载 JDBC 驱动并安装到本地 Maven 仓库
