# 数据库配置说明
# 本脚手架支持多种数据库，通过修改 application.yml 中的配置切换

# ============================================================
# H2 内存数据库 (默认 - 零外部依赖，开箱即用；重启后数据丢失)
# ============================================================
spring:
  datasource:
    url: jdbc:h2:mem:{{projectPkg}};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

