name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # 创建 GitHub Release
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # prepublishOnly 现在是 `npm test && npm run test:scaffold`，后者会生成三端项目
      # 跑真实构建（含后端 Maven，release 21）。本 job 只装 Node 的话，npm publish
      # 会挂在 "release version 21 not supported" —— v3.0.6 首次发布即栽在这里。
      # CI 的 stable-scaffold job 有 setup-java，发布 job 必须同口径。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run tests
        run: npm test

      # 以 tag 为版本真源：package.json 版本自动与 tag 对齐，无需手动 bump
      - name: Sync version from tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Syncing package.json version to ${TAG_VERSION}"
          npm pkg set version="${TAG_VERSION}"

      # 幂等：该版本已在 npm 上则跳过 publish（重跑 workflow 不会失败）
      - name: Check if already published
        id: check
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if npm view "@vima-tech/cli@${TAG_VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@vima-tech/cli@${TAG_VERSION} already on npm, skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.published == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes
          fi
