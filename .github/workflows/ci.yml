# CI：零依赖仓库，无 install 步骤——语法扫描 + 单测 + 端到端冒烟 + 发布包内容自检
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # templates/ 也要扫：里面的 hook 是会真跑的代码，且它们从不被单测 import，
      # 语法错误只会在真实会话里表现为「这个 hook 怎么没反应」。
      - name: 语法扫描（node --check）
        run: find bin lib tests scripts templates -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: 单测
        run: npm test
      # 冒烟走真实 CLI 进程，能抓到 import 内部函数绕过去的东西：
      # 参数解析、退出码、stdout/stderr 分流、以及模板装进新项目后能不能真的跑起来。
      - name: 端到端冒烟
        run: npm run smoke
      - name: 发布包内容自检
        run: npm pack --dry-run
